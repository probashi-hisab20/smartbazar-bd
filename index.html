<!DOCTYPE html><img src="logo.png"
     alt="SmartBazar BD"
     class="site-logo">
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartBazar BD</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f7f4;
 color:#18352d;
}
header{
 background:#075b45;
 color:white;
 text-align:center;
 padding:22px 10px;
}
header h1{margin:0;font-size:27px}
header span{color:#ffd36a}
header p{margin:8px 0 0}
main{max-width:1100px;margin:auto;padding:15px}
.search{display:flex;gap:8px;margin-bottom:15px}
input,textarea{
 width:100%;padding:12px;
 border:1px solid #ccc;
 border-radius:8px;
 font-size:15px;
}
button{
 background:#07845f;
 color:white;
 border:0;
 border-radius:8px;
 padding:11px 14px;
 font-weight:bold;
 cursor:pointer;
}
.categories{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-bottom:20px;
}
.categories .active{background:#18352d}
h2{font-size:21px}
.products{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}
.card{
 background:white;
 border-radius:12px;
 overflow:hidden;
 box-shadow:0 2px 8px #0001;
}
.card img{
 width:100%;
 height:145px;
 object-fit:cover;
}
.info{padding:10px}
.info h3{margin:4px 0}
.desc{font-size:13px;color:#666}
.price{
 color:#07845f;
 font-size:19px;
 font-weight:bold;
 margin:10px 0;
}
.order{width:100%}
.empty{
 grid-column:1/-1;
 text-align:center;
 padding:25px;
 background:white;
 border-radius:10px;
}
footer{
 background:#075b45;
 color:white;
 text-align:center;
 padding:22px;
 margin-top:20px;
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0009;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:10;
}
.modal.show{display:flex}
.form{
 background:white;
 padding:18px;
 border-radius:12px;
 width:100%;
 max-width:420px;
}
.form input,.form textarea{margin:6px 0}
.form textarea{min-height:75px}
.form button{width:100%;margin-top:8px}
.close{background:#777}
@media(min-width:650px){
 .products{grid-template-columns:repeat(3,1fr)}
 .card img{height:190px}
}
@media(min-width:950px){
 .products{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<header>
<h1>SmartBazar <span>BD</span></h1>
<p>আপনার পছন্দ, আপনার বাজার 🛍️</p>
</header>

<main>

<div class="search">
<input id="search" placeholder="পণ্য খুঁজুন..." oninput="showProducts()">
<button onclick="showProducts()">খুঁজুন</button>
</div>

<div class="categories">
<button class="active" onclick="filterCat('সব',this)">সব পণ্য</button>
<button onclick="filterCat('ইলেকট্রনিক্স',this)">ইলেকট্রনিক্স</button>
<button onclick="filterCat('ফ্যাশন',this)">ফ্যাশন</button>
<button onclick="filterCat('ঘর ও রান্নাঘর',this)">ঘর ও রান্নাঘর</button>
<button onclick="filterCat('অন্যান্য',this)">অন্যান্য</button>
</div>

<h2>আমাদের পণ্যসমূহ</h2>
<div class="products" id="products"></div>

</main>

<footer>
<h2>SmartBazar BD</h2>
<p>ধন্যবাদ আমাদের সঙ্গে থাকার জন্য ❤️</p>
</footer>

<div class="modal" id="modal">
<div class="form">
<h2>অর্ডার সম্পন্ন করুন</h2>
<p id="selectedProduct"></p>

<input id="customer" placeholder="আপনার নাম">
<input id="phone" placeholder="মোবাইল নম্বর">
<textarea id="address" placeholder="আপনার সম্পূর্ণ ঠিকানা"></textarea>

<button onclick="sendOrder()">WhatsApp-এ অর্ডার করুন</button>
<button class="close" onclick="closeOrder()">বন্ধ করুন</button>
</div>
</div>

<script>

// WhatsApp নম্বর
const WHATSAPP_NUMBER = "8801916551788";

// পণ্যের তালিকা
const items = [
{
name:"স্মার্ট হাতঘড়ি",
cat:"ফ্যাশন",
price:850,
image:"https://placehold.co/600x420?text=Smart+Watch",
desc:"আকর্ষণীয় ডিজাইনের হাতঘড়ি"
},
{
name:"মোবাইল স্ট্যান্ড",
cat:"ইলেকট্রনিক্স",
price:350,
image:"https://placehold.co/600x420?text=Mobile+Stand",
desc:"মজবুত মোবাইল স্ট্যান্ড"
},
{
name:"কিচেন কাটার",
cat:"ঘর ও রান্নাঘর",
price:450,
image:"https://placehold.co/600x420?text=Kitchen+Cutter",
desc:"রান্নাঘরের প্রয়োজনীয় পণ্য"
},
{
name:"স্টাইলিশ টি-শার্ট",
cat:"ফ্যাশন",
price:550,
image:"https://placehold.co/600x420?text=T-Shirt",
desc:"আরামদায়ক টি-শার্ট"
},
{
name:"ব্লুটুথ ইয়ারফোন",
cat:"ইলেকট্রনিক্স",
price:750,
image:"https://placehold.co/600x420?text=Earbuds",
desc:"দৈনন্দিন ব্যবহারের ইয়ারফোন"
},
{
name:"পানির বোতল",
cat:"অন্যান্য",
price:300,
image:"https://placehold.co/600x420?text=Water+Bottle",
desc:"সহজে বহনযোগ্য বোতল"
}
];

let currentCategory="সব";
let selectedItem=null;

// পণ্য দেখানো
function showProducts(){

const list=document.getElementById("products");
const query=document.getElementById("search").value.toLowerCase();

const filtered=items.filter(item=>{
const categoryOK=currentCategory==="সব" || item.cat===currentCategory;
const searchOK=(item.name+" "+item.cat+" "+item.desc).toLowerCase().includes(query);
return categoryOK && searchOK;
});

if(filtered.length===0){
list.innerHTML='<div class="empty">কোনো পণ্য পাওয়া যায়নি।</div>';
return;
}

list.innerHTML=filtered.map(item=>{
const index=items.indexOf(item);

return `
<div class="card">
<img src="${item.image}" alt="${item.name}">
<div class="info">
<h3>${item.name}</h3>
<p class="desc">${item.desc}</p>
<div class="price">৳ ${item.price}</div>
<button class="order" onclick="openOrder(${index})">
অর্ডার করুন
</button>
</div>
</div>
`;
}).join("");

}

// ক্যাটাগরি
function filterCat(category,button){

currentCategory=category;

document.querySelectorAll(".categories button")
.forEach(btn=>btn.classList.remove("active"));

button.classList.add("active");

showProducts();
}

// অর্ডার ফর্ম
function openOrder(index){

selectedItem=items[index];

document.getElementById("selectedProduct").innerText=
selectedItem.name+" - ৳ "+selectedItem.price;

document.getElementById("modal").classList.add("show");
}

function closeOrder(){
document.getElementById("modal").classList.remove("show");
}

// WhatsApp অর্ডার
function sendOrder(){

const customer=document.getElementById("customer").value.trim();
const phone=document.getElementById("phone").value.trim();
const address=document.getElementById("address").value.trim();

if(!customer || !phone || !address){
alert("সব তথ্য পূরণ করুন।");
return;
}

if(!selectedItem){
alert("আগে পণ্য নির্বাচন করুন।");
return;
}

const message=
"নতুন অর্ডার - SmartBazar BD\n"+
"পণ্য: "+selectedItem.name+"\n"+
"দাম: ৳ "+selectedItem.price+"\n"+
"নাম: "+customer+"\n"+
"মোবাইল: "+phone+"\n"+
"ঠিকানা: "+address;

const url="https://wa.me/"+WHATSAPP_NUMBER+
"?text="+encodeURIComponent(message);

window.open(url,"_blank");
}

// প্রথমবার পণ্য দেখানো
showProducts();

</script>

</body>
  </html>
